name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily: the API and the docs guide change in the euromail.dev repo.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (Node ${{ matrix.node-version }})
    if: github.event_name != 'schedule'
    # A fork's code never runs on our own runners.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'kalle-works-arm64' }}
    strategy:
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  published:
    name: Matches euromail.dev
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'kalle-works-arm64' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # The guide follows a new tool, so it is checked on the schedule rather
      # than blocking the PR that adds the tool.
      - run: npm run check:published -- ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--guide' || '' }}

  publish:
    name: Publish to npm
    needs: [test, published]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # npm trusted publishing (OIDC) does not support self-hosted runners.
    runs-on: ubuntu-latest
    # A newer push must not cancel a publish halfway.
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Publish if the version changed
        # Trusted publishing needs npm >= 11.5.1 and Node 22 ships npm 10.
        # Upgrading the global npm in place breaks mid-install, so npx runs a
        # pinned one instead.
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          # Asks for this exact version, so a revert or a lower version is
          # never republished over `latest`. Only "not published" (E404)
          # means publish; any other registry error fails the step.
          if npm view "@euromail/mcp-server@$LOCAL" version 2>npm-view.err | grep -q .; then
            echo "Version $LOCAL is already published, skipping."
            exit 0
          fi
          if [ -s npm-view.err ]; then
            grep -q E404 npm-view.err || { cat npm-view.err; exit 1; }
          fi
          # npm moves `latest` to whatever is published, so a version below
          # it would roll every `npx` user back.
          LATEST=$(npm view @euromail/mcp-server version)
          if [ "$(printf '%s\n%s\n' "$LATEST" "$LOCAL" | sort -V | tail -n 1)" != "$LOCAL" ]; then
            echo "::error::$LOCAL is lower than the published latest, $LATEST"
            exit 1
          fi
          echo "Publishing $LOCAL"
          unset NODE_AUTH_TOKEN
          npx -y npm@11.12.1 publish --access public
